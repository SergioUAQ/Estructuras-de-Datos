<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="640" height="220" viewBox="0 0 640 220" xml:space="preserve">
<title>Colision en una tabla hash resuelta con encadenamiento</title>
<style type="text/css">
	rect.caja{ fill: #fff; stroke: #000; stroke-width: 1.4; }
	rect.caja.vacia{ stroke-dasharray: 5,4; stroke: #bbb; }
	rect.pill{ fill: #CFE0FF; stroke: #3B82F6; stroke-width: 1.3; }
	line.flecha{ stroke: #000; stroke-width: 1.5; }
	polygon{ fill: #000; }
	text{ font-family: Helvetica, Arial, sans-serif; text-anchor: middle; }
	.pill-txt{ font-size: 11px; font-weight: bold; }
	.indice{ font-size: 12px; fill: #777; }
	.nota{ font-size: 12.5px; fill: #333; }
	.nota-izq{ font-size: 12.5px; fill: #333; text-anchor: start; }
</style>

<text class="nota-izq" x="4" y="18">hash_simple(&quot;Ana&quot;) y</text>
<text class="nota-izq" x="4" y="34">hash_simple(&quot;Leo&quot;) dan 0</text>
<line class="flecha" x1="60" y1="40" x2="60" y2="66"/>
<polygon points="60,70 54,58 66,58"/>

<!-- 8 cubetas -->
<rect class="caja" x="30" y="70" width="60" height="90"/>
<rect class="pill" x="34" y="78" width="52" height="24"/>
<text class="pill-txt" x="60" y="94">Ana: 20</text>
<rect class="pill" x="34" y="108" width="52" height="24"/>
<text class="pill-txt" x="60" y="124">Leo: 30</text>
<text class="indice" x="60" y="176">0</text>

<rect class="caja vacia" x="102" y="70" width="60" height="90"/>
<text class="indice" x="132" y="176">1</text>

<rect class="caja vacia" x="174" y="70" width="60" height="90"/>
<text class="indice" x="204" y="176">2</text>

<rect class="caja vacia" x="246" y="70" width="60" height="90"/>
<text class="indice" x="276" y="176">3</text>

<rect class="caja vacia" x="318" y="70" width="60" height="90"/>
<text class="indice" x="348" y="176">4</text>

<rect class="caja" x="390" y="70" width="60" height="90"/>
<rect class="pill" x="394" y="78" width="52" height="24"/>
<text class="pill-txt" x="420" y="94">Luis: 21</text>
<text class="indice" x="420" y="176">5</text>

<rect class="caja vacia" x="462" y="70" width="60" height="90"/>
<text class="indice" x="492" y="176">6</text>

<rect class="caja vacia" x="534" y="70" width="60" height="90"/>
<text class="indice" x="564" y="176">7</text>

<text class="nota" x="330" y="204">La cubeta 0 guarda una lista de pares, no un solo par &#8212; así se resuelve la colisión.</text>

</svg>
