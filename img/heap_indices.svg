<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="620" height="460" viewBox="0 0 620 460" xml:space="preserve">
<title>Relacion entre posiciones del arbol e indices del arreglo en un heap</title>
<style type="text/css">
	circle{ fill: #fff; stroke: #000; stroke-width: 1.5; }
	rect.celda{ fill: #fff; stroke: #000; }
	line{ stroke: #000; stroke-width: 1.5; }
	text{ font-family: Helvetica, Arial, sans-serif; text-anchor: middle; }
	.valor{ font-size: 20px; }
	.indice{ font-size: 12px; fill: #777; }
	.formula{ font-size: 15px; text-anchor: start; }
	.leyenda{ font-size: 13px; text-anchor: start; }
	.padre{ fill: #BFE3FF; }
	.elegido{ fill: #FFD27F; }
	.hijo{ fill: #C8F2C8; }
</style>

<!-- leyenda -->
<rect x="10" y="8" width="16" height="16" class="padre" stroke="#000"/>
<text class="leyenda" x="32" y="21">padre</text>
<rect x="10" y="30" width="16" height="16" class="elegido" stroke="#000"/>
<text class="leyenda" x="32" y="43">nodo elegido (i = 1)</text>
<rect x="10" y="52" width="16" height="16" class="hijo" stroke="#000"/>
<text class="leyenda" x="32" y="65">hijos</text>

<!-- aristas del arbol -->
<line x1="310" y1="50" x2="180" y2="140"/>
<line x1="310" y1="50" x2="440" y2="140"/>
<line x1="180" y1="140" x2="100" y2="230"/>
<line x1="180" y1="140" x2="260" y2="230"/>
<line x1="440" y1="140" x2="380" y2="230"/>
<line x1="440" y1="140" x2="500" y2="230"/>

<!-- nodos del arbol -->
<circle class="padre" cx="310" cy="50" r="26"/>
<text class="valor" x="310" y="58">1</text>

<circle class="elegido" cx="180" cy="140" r="26"/>
<text class="valor" x="180" y="148">3</text>

<circle cx="440" cy="140" r="26"/>
<text class="valor" x="440" y="148">2</text>

<circle class="hijo" cx="100" cy="230" r="26"/>
<text class="valor" x="100" y="238">7</text>

<circle class="hijo" cx="260" cy="230" r="26"/>
<text class="valor" x="260" y="238">5</text>

<circle cx="380" cy="230" r="26"/>
<text class="valor" x="380" y="238">4</text>

<circle cx="500" cy="230" r="26"/>
<text class="valor" x="500" y="238">8</text>

<!-- arreglo (mismo orden, recorrido por niveles) -->
<rect class="celda padre" x="20" y="290" width="50" height="50"/>
<text class="valor" x="45" y="322">1</text>
<text class="indice" x="45" y="357">0</text>

<rect class="celda elegido" x="100" y="290" width="50" height="50"/>
<text class="valor" x="125" y="322">3</text>
<text class="indice" x="125" y="357">1</text>

<rect class="celda" x="180" y="290" width="50" height="50"/>
<text class="valor" x="205" y="322">2</text>
<text class="indice" x="205" y="357">2</text>

<rect class="celda hijo" x="260" y="290" width="50" height="50"/>
<text class="valor" x="285" y="322">7</text>
<text class="indice" x="285" y="357">3</text>

<rect class="celda hijo" x="340" y="290" width="50" height="50"/>
<text class="valor" x="365" y="322">5</text>
<text class="indice" x="365" y="357">4</text>

<rect class="celda" x="420" y="290" width="50" height="50"/>
<text class="valor" x="445" y="322">4</text>
<text class="indice" x="445" y="357">5</text>

<rect class="celda" x="500" y="290" width="50" height="50"/>
<text class="valor" x="525" y="322">8</text>
<text class="indice" x="525" y="357">6</text>

<!-- formulas, con el caso i = 1 resuelto -->
<text class="formula" x="20" y="395">padre(i) = (i - 1) // 2  <tspan fill="#2E7D32">&#8594;</tspan> padre(1) = 0</text>
<text class="formula" x="20" y="418">hijo_izquierdo(i) = 2i + 1  <tspan fill="#2E7D32">&#8594;</tspan> hijo_izquierdo(1) = 3</text>
<text class="formula" x="20" y="441">hijo_derecho(i) = 2i + 2  <tspan fill="#2E7D32">&#8594;</tspan> hijo_derecho(1) = 4</text>

</svg>
