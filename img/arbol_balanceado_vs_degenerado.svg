<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="620" height="350" viewBox="0 0 620 350" xml:space="preserve">
<title>Mismos 7 valores, distinto orden de insercion: arbol balanceado vs degenerado</title>
<style type="text/css">
	circle{ fill: #fff; stroke: #000; stroke-width: 1.5; }
	line{ stroke: #000; stroke-width: 1.5; }
	text{ font-family: Helvetica, Arial, sans-serif; text-anchor: middle; }
	.valor{ font-size: 14px; font-weight: bold; }
	.orden{ font-size: 12.5px; fill: #666; }
	.altura{ font-size: 15px; font-weight: bold; }
</style>

<!-- panel izquierdo: balanceado -->
<text class="orden" x="120" y="18">orden: 4, 2, 6, 1, 3, 5, 7</text>

<line x1="120" y1="50" x2="70" y2="120"/>
<line x1="120" y1="50" x2="170" y2="120"/>
<line x1="70" y1="120" x2="45" y2="190"/>
<line x1="70" y1="120" x2="95" y2="190"/>
<line x1="170" y1="120" x2="145" y2="190"/>
<line x1="170" y1="120" x2="195" y2="190"/>

<circle cx="120" cy="50" r="20"/>
<text class="valor" x="120" y="55">4</text>
<circle cx="70" cy="120" r="20"/>
<text class="valor" x="70" y="125">2</text>
<circle cx="170" cy="120" r="20"/>
<text class="valor" x="170" y="125">6</text>
<circle cx="45" cy="190" r="20"/>
<text class="valor" x="45" y="195">1</text>
<circle cx="95" cy="190" r="20"/>
<text class="valor" x="95" y="195">3</text>
<circle cx="145" cy="190" r="20"/>
<text class="valor" x="145" y="195">5</text>
<circle cx="195" cy="190" r="20"/>
<text class="valor" x="195" y="195">7</text>

<text class="altura" x="120" y="230">altura = 3</text>

<!-- panel derecho: degenerado -->
<text class="orden" x="440" y="18">orden: 1, 2, 3, 4, 5, 6, 7 (ya ordenado)</text>

<line x1="320" y1="50" x2="360" y2="90"/>
<line x1="360" y1="90" x2="400" y2="130"/>
<line x1="400" y1="130" x2="440" y2="170"/>
<line x1="440" y1="170" x2="480" y2="210"/>
<line x1="480" y1="210" x2="520" y2="250"/>
<line x1="520" y1="250" x2="560" y2="290"/>

<circle cx="320" cy="50" r="18"/>
<text class="valor" x="320" y="55">1</text>
<circle cx="360" cy="90" r="18"/>
<text class="valor" x="360" y="95">2</text>
<circle cx="400" cy="130" r="18"/>
<text class="valor" x="400" y="135">3</text>
<circle cx="440" cy="170" r="18"/>
<text class="valor" x="440" y="175">4</text>
<circle cx="480" cy="210" r="18"/>
<text class="valor" x="480" y="215">5</text>
<circle cx="520" cy="250" r="18"/>
<text class="valor" x="520" y="255">6</text>
<circle cx="560" cy="290" r="18"/>
<text class="valor" x="560" y="295">7</text>

<text class="altura" x="440" y="325">altura = 7 (degenera en lista)</text>

</svg>
