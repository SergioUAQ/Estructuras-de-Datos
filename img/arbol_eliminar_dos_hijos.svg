<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="600" height="260" viewBox="0 0 600 260" xml:space="preserve">
<title>Eliminar un nodo con dos hijos: se reemplaza por su sucesor</title>
<style type="text/css">
	circle{ fill: #fff; stroke: #000; stroke-width: 1.6; }
	circle.objetivo{ fill: #FAD1D2; stroke: #D13438; }
	circle.sucesor{ fill: #CFE0FF; stroke: #3B82F6; }
	circle.nuevo{ fill: #C9F0DC; stroke: #1AA160; }
	line{ stroke: #000; stroke-width: 1.6; }
	text{ font-family: Helvetica, Arial, sans-serif; text-anchor: middle; }
	.valor{ font-size: 16px; font-weight: bold; }
	.titulo{ font-size: 16px; font-weight: bold; }
	.etiqueta{ font-size: 11px; }
	.etiqueta.objetivo-txt{ fill: #D13438; }
	.etiqueta.sucesor-txt{ fill: #3B82F6; }
	.etiqueta.nuevo-txt{ fill: #1AA160; }
	.conector{ font-size: 28px; fill: #888; }
	.conector-txt{ font-size: 12px; fill: #888; }
</style>

<text class="titulo" x="150" y="18">Antes</text>
<text class="titulo" x="450" y="18">Después</text>

<text class="conector" x="295" y="140">&#10140;</text>
<text class="conector-txt" x="295" y="162">eliminar(3)</text>

<!-- Panel A: antes -->
<line x1="130" y1="50" x2="70" y2="130"/>
<line x1="130" y1="50" x2="190" y2="130"/>
<line x1="190" y1="130" x2="150" y2="210"/>
<line x1="190" y1="130" x2="230" y2="210"/>

<circle class="objetivo" cx="130" cy="50" r="24"/>
<text class="valor" x="130" y="55">3</text>
<text class="etiqueta objetivo-txt" x="130" y="92">objetivo</text>

<circle cx="70" cy="130" r="24"/>
<text class="valor" x="70" y="135">1</text>

<circle cx="190" cy="130" r="24"/>
<text class="valor" x="190" y="135">6</text>

<circle class="sucesor" cx="150" cy="210" r="24"/>
<text class="valor" x="150" y="215">4</text>
<text class="etiqueta sucesor-txt" x="150" y="250">sucesor</text>

<circle cx="230" cy="210" r="24"/>
<text class="valor" x="230" y="215">7</text>

<!-- Panel B: despues -->
<line x1="430" y1="50" x2="370" y2="130"/>
<line x1="430" y1="50" x2="490" y2="130"/>
<line x1="490" y1="130" x2="530" y2="210"/>

<circle class="nuevo" cx="430" cy="50" r="24"/>
<text class="valor" x="430" y="55">4</text>
<text class="etiqueta nuevo-txt" x="430" y="92">se copió aquí</text>

<circle cx="370" cy="130" r="24"/>
<text class="valor" x="370" y="135">1</text>

<circle cx="490" cy="130" r="24"/>
<text class="valor" x="490" y="135">6</text>

<circle cx="530" cy="210" r="24"/>
<text class="valor" x="530" y="215">7</text>

</svg>
