<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="600" height="400" viewBox="0 0 600 400" xml:space="preserve">
<title>Cola circular: los indices frente y final avanzan con modulo y regresan a 0</title>
<style type="text/css">
	rect{ fill: #fff; stroke: #000; }
	rect.libre{ stroke-dasharray: 6,4; }
	circle.guia{ fill: none; stroke: #ddd; stroke-dasharray: 4,4; }
	line{ stroke: #000; stroke-width: 1.5; }
	polygon{ fill: #000; }
	text{ font-family: Helvetica, Arial, sans-serif; text-anchor: middle; }
	.valor{ font-size: 22px; }
	.indice{ font-size: 12px; fill: #999; }
	.rotulo{ font-size: 15px; font-weight: bold; }
	.vuelta{ font-size: 30px; fill: #777; }
</style>

<circle class="guia" cx="300" cy="190" r="130"/>

<!-- indice 0, ocupado -->
<rect x="270" y="30" width="60" height="60"/>
<text class="valor" x="300" y="68">F</text>
<text class="indice" x="278" y="44">0</text>

<!-- indice 1, ocupado, final -->
<rect x="382.6" y="95" width="60" height="60"/>
<text class="valor" x="412.6" y="133">G</text>
<text class="indice" x="390.6" y="109">1</text>

<!-- indice 2, libre -->
<rect class="libre" x="382.6" y="225" width="60" height="60"/>
<text class="indice" x="390.6" y="239">2</text>

<!-- indice 3, libre -->
<rect class="libre" x="270" y="290" width="60" height="60"/>
<text class="indice" x="278" y="304">3</text>

<!-- indice 4, ocupado, frente -->
<rect x="157.4" y="225" width="60" height="60"/>
<text class="valor" x="187.4" y="263">D</text>
<text class="indice" x="165.4" y="239">4</text>

<!-- indice 5, ocupado -->
<rect x="157.4" y="95" width="60" height="60"/>
<text class="valor" x="187.4" y="133">E</text>
<text class="indice" x="165.4" y="109">5</text>

<!-- callout frente -->
<line x1="70" y1="255" x2="152" y2="255"/>
<polygon points="157,255 147,249 147,261"/>
<text class="rotulo" x="105" y="240">frente</text>

<!-- callout final -->
<line x1="530" y1="125" x2="448" y2="125"/>
<polygon points="443,125 453,119 453,131"/>
<text class="rotulo" x="500" y="110">final</text>

<!-- indicador de vuelta (modulo) cerca del cierre entre el indice 5 y el 0 -->
<text class="vuelta" x="300" y="25">&#8635;</text>

</svg>
